name: build-windows-custom

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows CLI
        run: bun run packages/opencode/script/build.ts --single --skip-embed-web-ui

      - name: Upload Windows CLI
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-custom
          path: packages/opencode/dist/opencode-windows-x64/bin/opencode.exe
